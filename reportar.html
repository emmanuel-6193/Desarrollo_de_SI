<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportar Incidente - Help Desk</title>
</head>
<body>
    <header>
        <h1>Sistema de Gestión de Incidentes</h1>
    <hr></header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="reportar.html">Reportar Incidente</a></li>
            <li><a href="tickets.html">Ver Tickets</a></li>
        </ul>
    </nav>

    <main>
        <section id="formulario-reporte">
            <h2>Formulario de Registro de Incidentes</h2>
            
            <form action="procesar.html" method="post">
                <fieldset>
                    <legend>Detalles Técnicos</legend>
                    
                    <p>
                        <label for="titulo">Título del Incidente:</label><br>
                        <input type="text" id="titulo" name="titulo" required>
                    </p>

                    <p>
                        <label for="categoria">Categoría:</label><br>
                        <select id="categoria" name="categoria">
                            <option value="red">Red</option>
                            <option value="hardware">Hardware</option>
                            <option value="software">Software</option>
                        </select>
                    </p>

                    <fieldset>
                        <legend>Nivel de Prioridad</legend>
                        <input type="radio" id="alta" name="prioridad" value="Alta">
                        <label for="alta">Alta</label>
                        
                        <input type="radio" id="media" name="prioridad" value="Media">
                        <label for="media">Media</label>
                        
                        <input type="radio" id="baja" name="prioridad" value="Baja">
                        <label for="baja">Baja</label>
                    </fieldset>

                    <p>
                        <label for="descripcion">Descripción detallada:</label><br>
                        <textarea id="descripcion" name="descripcion" rows="4" cols="50"></textarea>
                    </p>

                    <p>
                        <button type="submit">Enviar Reporte</button>
                    </p>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>UTM - Facultad de Ciencias Informáticas</p>
    </footer>
</body>
</html>
