<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Incidente - Help Desk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="uikit-container">
        <header class="uikit-header">
            <h1>Sistema de Gestión de Incidentes</h1>
            <p>Módulo de Registro de Requerimientos</p>
        </header>

        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Inicio</a></li>
                <li><a href="reportar.html" class="nav-link active">Reportar Incidente</a></li>
                <li><a href="tickets.html" class="nav-link">Ver Tickets</a></li>
            </ul>
        </nav>

        <main>
            <section class="uikit-section">
                <h2>Formulario de Registro de Incidentes</h2>
                
                <form action="#" method="get">
                    <fieldset class="form-fieldset">
                        <legend class="form-legend">Detalles Técnicos</legend>
                        
                        <div class="form-group">
                            <label class="form-label" for="titulo">Título del Incidente:</label>
                            <input class="form-control" type="text" id="titulo" name="titulo" placeholder="Ej. Falla de conexión interna..." required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="categoria">Categoría:</label>
                            <select class="form-control" id="categoria" name="categoria">
                                <option value="red">Red</option>
                                <option value="hardware">Hardware</option>
                                <option value="software">Software</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Nivel de Prioridad:</label>
                            <div class="radio-gallery">
                                <label class="radio-option">
                                    <input type="radio" id="alta" name="prioridad" value="Alta" checked>
                                    <span>Alta</span>
                                </label>
                                <label class="radio-option">
                                    <input type="radio" id="media" name="prioridad" value="Media">
                                    <span>Media</span>
                                </label>
                                <label class="radio-option">
                                    <input type="radio" id="baja" name="prioridad" value="Baja">
                                    <span>Baja</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="descripcion">Descripción detallada:</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="4" placeholder="Describa el comportamiento del error detectado..."></textarea>
                        </div>

                        <div class="form-actions" style="display: flex; gap: 1rem;">
                            <button type="submit" class="btn btn-primary">Enviar Reporte</button>
                            <button type="reset" class="btn btn-secondary">Limpiar Formulario</button>
                        </div>
                    </fieldset>
                </form>
            </section>
        </main>

        <footer class="app-footer">
            <p>UTM - Facultad de Ciencias Informáticas</p>
        </footer>
    </div>

</body>
</html>
